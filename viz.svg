<text x="56.0" y="279.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">One question kills one candidate: does A know B? Yes → A is no celebrity. No → B</text>
